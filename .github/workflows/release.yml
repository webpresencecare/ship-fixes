# Publishes a GitHub release when a version tag is pushed (git tag v0.1.0, then push the tag; GitHub Desktop: History,
# right-click the commit, Create Tag, then Push). The release carries <slug>.zip with a <slug>/ root folder; GitHub
# publishes its sha256 digest.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the zip (checks that the tag matches the plugin version)
        run: bash bin/build-zip.sh "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/*.zip)
          slug=$(basename "$zip" .zip)
          gh release create "$GITHUB_REF_NAME" "$zip" --title "$slug $GITHUB_REF_NAME" --generate-notes --verify-tag
